<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ears and Voice · settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&amp;family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#1B1915}
a{color:#9E2616}a:hover{color:#C7321F}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 466px; height: 678px; box-sizing: border-box; background: #F7F4EE; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 58px 24px 24px 24px; gap: 22px">

  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Pocket.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid #D9D2C4; display: flex; align-items: center; justify-content: center; text-decoration: none; margin-left: -4px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1915" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="font-family: Newsreader, Georgia, serif; font-weight: 500; font-size: 32px; color: #1B1915">Ears &amp; Voice</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5A554B">Ears · turns what you say into text</div>
    <div style="background: #EDE8DE; border-radius: 16px; display: flex; flex-direction: column">
      <sc-for list="{{ears}}" as="e" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-top: 1px solid rgba(27,25,21,0.07)">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <div style="font-size: 16px; font-weight: 500; color: #1B1915">{{e.name}}</div>
            <div style="font-size: 12px; color: #5A554B">{{e.sub}}</div>
          </div>
          <sc-if value="{{e.on}}" hint-placeholder-val="{{ true }}">
            <svg role="img" aria-label="Selected" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C7321F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>
          </sc-if>
          <sc-if value="{{e.get}}" hint-placeholder-val="{{ false }}">
            <button style="height: 32px; padding: 0 14px; border-radius: 16px; border: 0; background: #F7F4EE; cursor: pointer; font-size: 13px; font-weight: 600; color: #9E2616">Get</button>
          </sc-if>
          <sc-if value="{{e.remove}}" hint-placeholder-val="{{ false }}">
            <button aria-label="Remove download" style="width: 32px; height: 32px; border-radius: 16px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A554B" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h14M10 11v6M14 11v6M7 7l1 13h8l1-13M9 7V4h6v3"/></svg>
            </button>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5A554B">Voice · reads text aloud</div>
    <div style="background: #EDE8DE; border-radius: 16px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 12px; padding: 13px 16px">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <div style="font-size: 16px; font-weight: 500; color: #1B1915">Ava · Enhanced</div>
          <div style="font-size: 12px; color: #5A554B">On this iPhone · English</div>
        </div>
        <svg role="img" aria-label="Selected" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C7321F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-top: 1px solid rgba(27,25,21,0.07)">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <div style="font-size: 16px; font-weight: 500; color: #1B1915">Your Personal Voice</div>
          <div style="font-size: 12px; color: #5A554B">Hear your notes read back in your own voice</div>
        </div>
        <button style="height: 32px; padding: 0 14px; border-radius: 16px; border: 0; background: #F7F4EE; cursor: pointer; font-size: 13px; font-weight: 600; color: #9E2616">Set up</button>
      </div>
      <a href="Settings.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-top: 1px solid rgba(27,25,21,0.07); text-decoration: none">
        <div style="flex: 1; font-size: 16px; font-weight: 500; color: #1B1915">More voices</div>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A554B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </a>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="background: #EDE8DE; border-radius: 16px; display: flex; align-items: center; gap: 12px; padding: 13px 16px">
      <label for="siri" style="flex: 1; font-size: 16px; font-weight: 500; color: #1B1915">“Hey Siri, start Verso”</label>
      <input id="siri" type="checkbox" checked style="width: 44px; height: 26px; accent-color: #C7321F; margin: 0">
    </div>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #5A554B">
    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5A554B" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    Everything stays on this iPhone. No account, no upload.
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":466,"height":678}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      ears: [
        { name: 'Parakeet', sub: 'Recommended · 25 languages · 630 MB', on: true, get: false, remove: false },
        { name: 'Whisper', sub: '99 languages · 400 MB', on: false, get: true, remove: false },
        { name: 'SenseVoice', sub: 'Chinese, Cantonese, Japanese, Korean · 450 MB', on: false, get: false, remove: true },
        { name: 'Apple Speech', sub: 'Built into iOS · languages on this device', on: false, get: true, remove: false }
      ]
    };
  }
}
</script>
</body>
</html>
